name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m healthcheck validate
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/status.test.mjs tests/scheduler.test.mjs
      - run: python -m healthcheck build
